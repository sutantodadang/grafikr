[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "grafikr-ui"
version = "1.1.0"
description = "Python desktop UI client for Grafikr"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
readme = "README.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grafikr = [
    "_runtime/*/manifest.json",
    "_runtime/*/LICENSE",
    "_runtime/*/bin/*",
    "_runtime/*/lib/*",
    "_runtime/*/include/*",
    "_runtime/*/cmake/*",
    "_runtime/*/share/**/*",
]

[dependency-groups]
dev = [
    "build>=1.6.1",
]

